<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The sign-in card cannot be pressed until Google's script has landed,
         so the connection to it is opened alongside the fonts rather than when
         the script tag is reached. -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Learn Nomenclature by Playing</title>
    <!-- Google Identity Services, loaded once for the whole page. The sign-in
         card waits for it; nothing else in the app touches it. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
